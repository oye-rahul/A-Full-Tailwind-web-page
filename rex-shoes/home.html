<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rex-shoes</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Lilex:ital,wght@0,100..700;1,100..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div>
        <nav>
            <nav class="bg-white shadow-md fixed w-full z-50">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex justify-between items-center h-16">
      
      <!-- Logo -->
      <div class="flex-shrink-0 text-2xl font-bold text-gray-800 hover:text-indigo-600 transition">
        BrandName
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex space-x-8">
        <a href="#" class="text-gray-700 hover:text-indigo-600 transition">Home</a>
        <a href="#" class="text-gray-700 hover:text-indigo-600 transition">Services</a>
        <a href="#" class="text-gray-700 hover:text-indigo-600 transition">About</a>
        <a href="#" class="text-gray-700 hover:text-indigo-600 transition">Contact</a>
      </div>

      <!-- CTA Button -->
      <div class="hidden md:flex">
        <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700 transition">
          Get Started
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center">
        <button id="menu-btn" class="text-gray-700 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="menu" class="hidden md:hidden px-6 pb-4 space-y-2">
    <a href="#" class="block text-gray-700 hover:text-indigo-600 transition">Home</a>
    <a href="#" class="block text-gray-700 hover:text-indigo-600 transition">Services</a>
    <a href="#" class="block text-gray-700 hover:text-indigo-600 transition">About</a>
    <a href="#" class="block text-gray-700 hover:text-indigo-600 transition">Contact</a>
    <a href="#" class="block bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700 transition">
      Get Started
    </a>
  </div>
</nav>

<script>
  const btn = document.getElementById('menu-btn');
  const menu = document.getElementById('menu');
  btn.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });
</script>
        </nav>
    </div>

    <!-- main hero section -->
     <div class="flex items-center justify-center">
        <h1 class="font-poppins mt-20 text-7xl">NIKE</h1>
