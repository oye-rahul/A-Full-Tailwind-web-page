    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });

        // Fixed slides array with correct image URLs
        const slides = [
            {
                bg: "https://4kwallpapers.com/images/walls/thumbs_2t/11990.jpeg",
                title: "The Spider-Man, Advanced suit",
                info: "2h50m • 2020 • Action",
                desc: "An epic journey through mystical lands where heroes battle dark forces to save humanity from ultimate destruction."
            },
            {
                bg: "https://4kwallpapers.com/images/walls/thumbs_3t/21920.jpg",
                title: "The F1 Car",
                info: "2h10m • 2023 • Sci-Fi • Adventure",
                desc: "A breathtaking journey under the ocean with mythical creatures and ancient civilizations awakening."
            },
            {
                bg: "https://4kwallpapers.com/images/walls/thumbs_3t/17916.jpeg",
                title: "Avatar: Fire and Ash",
                info: "1h55m • 2021 • Thriller • Mystery",
                desc: "Dark secrets unfold as hunters chase shadows across the city in this heart-pounding thriller."
            },
            {
                bg: "https://4kwallpapers.com/images/walls/thumbs_3t/24385.jpg",
                title: " IT: Welcome To Derry",
                info: "2h35m • 2024 • Thriller • Mystery",
                desc: "Dark secrets unfold as hunters chase shadows across the city in this heart-pounding thriller."
            },
            {
                bg: "https://4kwallpapers.com/images/walls/thumbs_3t/24439.jpg",
                title: "David Corenswet (Superman)",
                info: "1h55m • 2021 • Thriller • Mystery",
                desc: "Dark secrets unfold as hunters chase shadows across the city in this heart-pounding thriller."
            }
        ];

        let index = 0;
        const bgSlider = document.getElementById("bg-slider");
        const slideTitle = document.getElementById("slideTitle");
        const slideInfo = document.getElementById("slideInfo");
        const slideDesc = document.getElementById("slideDesc");
        // const play = document.getElementById("Play");
        // const watch = document.getElementById("Watch");

        function showSlide(i) {
            // Set background image
            bgSlider.style.backgroundImage = `url('${slides[i].bg}')`;
            bgSlider.style.backgroundSize = 'cover';
            bgSlider.style.backgroundPosition = 'center';
            bgSlider.style.backgroundRepeat = 'no-repeat';

            // Set content
            slideTitle.textContent = slides[i].title;
            slideInfo.textContent = slides[i].info;
            slideDesc.textContent = slides[i].desc;
            // slideDesc.textContent = slides[i].paly;
            // slideDesc.textContent = slides[i].watch;

            // Smooth transition
            bgSlider.style.opacity = '0';
            setTimeout(() => {
                bgSlider.style.opacity = '1';
            }, 50);
        }

        // Auto change every 5 seconds
        setInterval(() => {
            index = (index + 1) % slides.length;
            showSlide(index);
        }, 5000);

        // First slide load
        showSlide(index);

        // Initial transition
        setTimeout(() => {
            bgSlider.style.transition = 'opacity 1s ease';
        }, 100);
    </script>
